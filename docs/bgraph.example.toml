# bgraph.toml: optional declarations for what bgraph cannot infer from the code.
#
# Put this file at the repository root and commit it. Without one, bgraph reads imports and runner configs on its own
# and widens the selection (to the project or to the full suite) whenever it is not sure. This file is the place to say
# what it could not find out.
#
# Every entry falls into one of two kinds, and the difference matters:
#
#   WIDENING   (safe):   adds dependencies, so more tests run. A wrong entry only costs time.
#   NARROWING  (trust):  tells bgraph that something it would widen on is fine, so fewer tests run. A wrong entry
#                        can make bgraph SKIP A TEST THAT THE CHANGE BREAKS. These entries require a `reason`;
#                        review them like code and re-check them when the config they describe changes.
#
# Changing this file is itself a change: like any unclaimed file it widens to the project at the repository root
# (unknown_file), or to the full suite when no project sits there. A file that does not parse selects the full suite
# (user_rule), and the error says where. Unknown keys are errors. Reference: docs/configuration.md.
#
# Paths are repo-relative with forward slashes. Globs: `*` (one segment), `**` (any depth), `?`, `[abc]`, `{a,b}`.
#
# Start from what bgraph tells you: `bgraph unresolved` lists every import or config key it could not read, and
# prints a ready-to-edit snippet for this file next to each one.

# ---------------------------------------------------------------------------------------------------------------------
# [[rule]]: a dependency that no import expresses.
#
#   paths   : globs of files whose change the rule is about (required).
#   affects : what such a change affects (required), one of:
#               "all"          -> run the full suite                                    (WIDENING)
#               [dirs/globs]   -> also run every test under these project directories,
#                                 or the tests matching these globs                     (WIDENING)
#               "none"         -> the change affects no test                            (NARROWING)
#                                 Only accepted for files nothing imports: if a file in `paths` is part of the
#                                 import graph, the rule is ignored and reported as rule_rejected.
#             A target may also be a unit ID as bgraph prints it (e.g. "go:internal/api"): exactly that unit.
#             Go: a module directory selects every package of the module; a package directory (e.g. "internal/api")
#             selects that package and the packages below it; a glob over .go files selects no Go unit.
#             PHP: use a project directory or an exact ID such as "services/api::php" (".::php" at the root).
#             Swift uses a package or test target directory, or an ID such as "swift:packages/kit::test:KitTests".
#             C and C++ use a build project directory or an ID such as "cpp:cmake:library::test:parse".
#             A target that matches no test unit is a configuration error: the selection becomes full (user_rule).
#   reason  : free text, shown in explanations. Strongly recommended; nothing checks it.
# ---------------------------------------------------------------------------------------------------------------------

[[rule]]
# Code is generated from the .proto files at build time; nothing imports the .proto files themselves.
paths = ["proto/**/*.proto"]
affects = ["services/api", "web/src/gen/**/*.test.ts"]
reason = "services/api and the web client are generated from the protos"

[[rule]]
# A test reads these fixtures with fs.readFileSync(path.join(__dirname, name)), a path bgraph cannot follow.
paths = ["tests/fixtures/**"]
affects = ["tests/format/**/*.test.js"]
reason = "format tests load every fixture by directory listing"

[[rule]]
# Python: a Cython/C source compiled into a module that tests import, in a project bgraph cannot see building it.
# (Without a rule, such a file widens to its whole Python project.)
paths = ["src/pkg/_fast.pyx"]
affects = ["tests/unit/**/test_fast*.py"]
reason = "only the fast-path tests import the compiled module"

[[rule]]
# Editor and repo-maintenance files that no test can observe.
paths = [".vscode/**", "CODEOWNERS"]
affects = "none"
reason = "not read by any build or test"

# ---------------------------------------------------------------------------------------------------------------------
# [[generated]]: build outputs that are ignored by git but imported by code (e.g. tests import "../dist/index.js").
#
# Without an entry, bgraph treats such an import as depending on every file of the package that builds it. An entry
# names the files the output is really built from, so only changes to those select the importing tests.
# (NARROWING: if the build also reads files outside `sources`, such as its own config, list them too.)
#
#   outputs : globs of the generated files (required).
#   sources : globs of the files they are built from. Empty -> keep the default (any file of the package).
#   owner   : the project directory that builds them (required).
# ---------------------------------------------------------------------------------------------------------------------

[[generated]]
outputs = ["packages/ui/dist/**"]
sources = ["packages/ui/src/**"]
owner = "packages/ui"

# ---------------------------------------------------------------------------------------------------------------------
# [[config]]: describe runner-config keys that are computed in code.                                  (NARROWING)
#
# bgraph reads vitest/vite/jest/playwright configs as literals. When a key that controls module resolution or the
# test set is built by code (a function call, a variable, a spread, a helper module), it cannot know the value and
# reports config_is_code: every test of the project is then selected for any change in the project. A [[config]]
# entry tells bgraph what that code computes, so it can stop widening for those keys of that one file.
#
# bgraph keeps every other check. The config file is still a dependency of all its tests; any key you do not list
# still widens; and if `file` does not exist, the entry does nothing and the widening stays.
#
#   file         : the runner config, e.g. "vitest.config.ts" (required).
#   replaces     : the computed keys this entry describes (required). Supported:
#                    "alias", "moduleNameMapper"           module aliases
#                    "include", "testMatch", "testRegex"   which files are tests
#                    "projects", "workspace"               sub-projects
#   reason       : why the description is right (required).
#
#   For "alias" / "moduleNameMapper":
#   alias        : { "<spec>" = "<path>" } with vite semantics: an import equal to <spec>, or starting with "<spec>/",
#                  resolves to <path> (plus the rest of the import). <path> is a file or directory in the repo.
#   alias_regex  : { "<regex>" = "<path>" } with jest moduleNameMapper semantics: the regex must match the whole
#                  import; $1..$9 in <path> are replaced by the groups. Use single quotes for regexes in TOML
#                  ('^@app/(.*)$') so backslashes are kept as written.
#                  Both may be omitted when the computed alias only points imports at what normal package
#                  resolution already finds (the workspace package's own package.json "exports"/"main").
#
#   For "include" / "testMatch" / "testRegex":
#   tests        : globs of the test files. Omitted -> bgraph's default detection (*.test.*, *.spec.*, files under
#                  __tests__/, test.js and similar names) must find every test; if some tests are named otherwise,
#                  list them here.
#
#   For "projects" / "workspace": no extra field. The entry states that the sub-projects only split the same tests
#                  (sharding, per-environment runs) and add no alias or test files beyond what this entry describes.
#
#   Optional, any key:
#   sources      : helper files the config imports to compute these keys (e.g. "scripts/aliases.js"). Their
#                  computed lookups (readdirSync, new URL(`../packages/${dir}`), dynamic import) are what this entry
#                  describes, so they no longer make every test depend on every file they could list. Their static
#                  imports stay, and editing a source still selects every test of the config.
#   ignore_paths : path literals written in the config that belong to the computation, not inputs of every test
#                  (e.g. the "packages/svelte" in path.resolve('packages/svelte', ...) inside a custom resolver).
#                  By default bgraph treats any repo path named in a config as a dependency of all its tests.
# ---------------------------------------------------------------------------------------------------------------------

[[config]]
# vue-style: resolve.alias = entries, built in scripts/aliases.js from a listing of packages/.
file = "vitest.config.ts"
replaces = ["alias"]
alias = { "vue" = "packages/vue/src/index.ts" }
alias_regex = { '^@vue/([a-z-]+)$' = "packages/$1/src/index.ts" }
sources = ["scripts/aliases.js"]
reason = "scripts/aliases.js maps vue to packages/vue/src and @vue/<dir> to packages/<dir>/src/index.ts"

[[config]]
# svelte-style: a customResolver that resolves svelte/* through packages/svelte/package.json "exports", and
# projects/include generated from a shard table.
file = "vitest.config.js"
replaces = ["alias", "include", "projects"]
tests = ["packages/svelte/**/*.test.ts", "packages/svelte/tests/*/test.ts"]
ignore_paths = ["packages/svelte"]
reason = "svelte_alias() follows the package exports; the projects only shard the same test files"

# ---------------------------------------------------------------------------------------------------------------------
# [[dynamic]]: describe what the dynamic imports of one file can load.                                (NARROWING)
#
# `importlib.import_module(name)`, `__import__(name)`, `pkgutil.iter_modules(...)` and a `sys.path` edit built at run
# time can load a module bgraph cannot name. By default such a site is unresolved at project scope: when a file the
# import system can load changes in the project (a .py, .pyi, .pyc, .so or .pyd file, added, changed or deleted), the
# file with the site and everything that depends on it is selected. Data files, docs and configuration never trigger
# it (they have their own rules). That is the sound default and it is often wide: a test runner that imports the test
# modules it collects makes every change select the runner's dependents.
#
# A [[dynamic]] entry replaces that rule for the sites it names with edges from the file to the globs you say it can
# load: a change to any file matching a glob (including files added later) reaches the file and its dependents, and
# nothing else does. The Python and Ruby ecosystems read [[dynamic]]; other ecosystems ignore it.
#
# If `file` does not exist, is not Python, or no dynamic site matches (a wrong `lines`), the entry is inert, the
# default stays, and `bgraph unresolved` lists it as a stale declaration. `bgraph unresolved` also prints a snippet to
# start from next to every dynamic site.
#
#   file          : repo-relative file that contains the dynamic sites (required).
#   lines         : only the sites on these lines (optional; default: every dynamic site of the file).
#   loads         : globs of the files those sites can load (one of loads / none / sys_path_only is required).
#   none          : true when the sites load nothing from the repo (plugins of installed packages only).
#   sys_path_only : true to describe the file's sys.path edits only: they change where imports are looked up, which
#                   bgraph already covers by matching unresolved imports anywhere in the repo. Cannot be combined
#                   with `lines`.
#   reason        : why the description is right (required).
# ---------------------------------------------------------------------------------------------------------------------

[[dynamic]]
# sympy-style: the test runner imports every test module it collects.
file = "sympy/utilities/runtests.py"
loads = ["sympy/**/tests/test_*.py", "sympy/**/tests/__init__.py"]
reason = "runtests.py only imports the test modules of the sympy tree it was asked to run"

[[dynamic]]
# django-style: settings are imported by dotted path from the DJANGO_SETTINGS_MODULE environment variable.
file = "django/conf/__init__.py"
lines = [112]
loads = ["django/conf/**/*.py", "tests/settings/*.py", "tests/*_settings.py"]
reason = "the settings module is a project settings file; no other repo module is imported by name here"

[[dynamic]]
file = "app/plugins.py"
none = true
reason = "load_plugins() imports entry points of installed packages, never a module of this repo"

# ---------------------------------------------------------------------------------------------------------------------
# [[ruby_autoload]]: follow named Ruby constants for selected lazy autoload files.                         (NARROWING)
# Keep the declaration scoped to conventional files reached through scanned Ruby references and explicit loads.

[[ruby_autoload]]
paths = ["app/services/**/*.rb"]
reason = "The test environment loads these services lazily through ordinary Ruby constants"

# ---------------------------------------------------------------------------------------------------------------------
# [dynamic_layer]: narrow widened selections with recorded test dependencies (docs/dynamic-layer.md).        (NARROWING)
#
# Off by default. When the static graph widens (a dynamic import, an unreferenced file...), the dynamic layer may remove
# a WIDENED test whose recorded run (`bgraph record`: each test file in its own process with an audit hook (Python) or a
# --require preload in every Node process and thread of the runner (Node)) shows that
# it loaded or opened none of the changed files. Tests reached through ordinary imports are never removed. Records are
# only used when complete (no subprocess, no native code outside the environment's trust), passing, made in the same
# environment (interpreter, installed distributions, manifests/lockfiles/runner configs at the base) and when every
# recorded dependency is unchanged at the base; and only when every changed file is an existing .py (Python) or
# .js/.mjs/.cjs/.jsx/.ts/.tsx/.mts/.cts (Node, not .d.ts) file that was modified (no addition, deletion, rename, stub,
# config, manifest or lockfile). It is not proven safe by research: enable it per
# ecosystem after evaluating it on your repository. `bgraph affected --dynamic` enables it for one run.
#
#   ecosystems       : ecosystems to narrow: "python", "node", "jvm". "jvm" is different (docs/dynamic-layer.md §9): it narrows
#                      the selected Maven modules / Gradle projects to the test classes whose recorded run (one fresh
#                      test JVM per class with a java agent, `bgraph record --eco jvm`) reaches a changed file; the
#                      modules are still built. Only when every changed file is a modified .java/.kt file of a compiled
#                      source root (or a documentation file) and no constant, annotation default or Kotlin const val
#                      changed; never with Lombok. JDK: JAVA_HOME, else java on PATH.
#   python           : interpreter for `bgraph record` and the environment fingerprint ("python" on PATH by default;
#                      a path with a separator is relative to the repo root, e.g. ".venv/Scripts/python.exe").
#   node             : node executable for `bgraph record` and the Node fingerprint ("node" on PATH by default).
#   php              : PHP executable for `bgraph record --eco php` (it must load Xdebug 3), the PHP fingerprint and the
#                      tokenizer cross-check of changed files ("php" on PATH by default). The "php" ecosystem narrows a
#                      selected Composer project to the test files whose recorded run (one process tree per test file,
#                      docs/dynamic-layer.md §11) included, read, stat'ed or listed a changed file, or executed a changed
#                      function when every change lies inside function bodies. PHPUnit >= 10 or Pest >= 2 with a PHPUnit
#                      XML configuration; only modified PHP code files or documentation files.
#   go               : go command for `bgraph record --eco go` and the Go fingerprint ("go" on PATH by default). The "go"
#                      ecosystem narrows a selected package to the top-level test functions whose recorded run (one
#                      process per function with Go coverage, docs/dynamic-layer.md §12) executed a changed function;
#                      the package is still built (`-run '^$'` when none is kept). Only when every changed file is a
#                      modified .go file whose changes lie inside function bodies, a test file or a documentation file.
#   trust_native_env : native extension modules installed in the environment (not CPython's own) do not make a
#                      record incomplete; their versions are part of the fingerprint. Default false. (Node: the
#                      toolchain addons of docs/dynamic-layer.md §8.3 are accepted without it.)
#                      Records made with another setting are not used.
#
# Not a [dynamic] table: [[dynamic]] above is the list of dynamic-import declarations.
# ---------------------------------------------------------------------------------------------------------------------

# [dynamic_layer]
# ecosystems = ["python"]
# python = ".venv/bin/python"
# node = "node"
# php = "php"
# go = "go"
# trust_native_env = false

# ---------------------------------------------------------------------------------------------------------------------
# [lockfile]: how a lockfile change is classified (docs/lockfiles.md).                         (NARROWING at L2)
#
#   level : "L1" (default) — pnpm-lock.yaml, package-lock.json and Cargo.lock: the projects whose resolved dependency
#                            closure changed, plus the tests that import their files; the lockfile's root project
#                            (workspace tooling) changing selects every project. Other formats and unreadable or
#                            format-changed lockfiles stay at L0.
#           "L2"           — npm and pnpm 6.x: within such a project, only the tests that import a changed direct
#                            dependency; guarded (install scripts, peers, toolchain/@types, unimported dependency → L1).
#           "L0"           — every project under the lockfile's directory.
# ---------------------------------------------------------------------------------------------------------------------

# [lockfile]
# level = "L1"

# ---------------------------------------------------------------------------------------------------------------------
# [options]
#   max_changed : above this many changed files, run the full suite (diff_too_large). Default 5000.
# ---------------------------------------------------------------------------------------------------------------------

[options]
max_changed = 5000
